<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘은 당신! 윳놀이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --sky1:#cbe8f7; --sky2:#e6f5fa;
    --cream:#fdf8ec; --cream2:#f7efdd;
    --wood1:#cf9a63; --wood2:#ac7444; --wood3:#8a5730;
    --green:#7cb35a; --mint:#cfe8ce; --pink:#f19fb6; --gold:#efb84a;
    --ink:#4a382a; --ink2:#7c6a58; --line:#e2d5bb;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; color:var(--ink); font-family:'Jua','Malgun Gothic',sans-serif;
    background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 45%,#eef5e6 100%);
    display:flex; flex-direction:column; align-items:center;
    padding:18px 14px 40px; overflow-x:hidden; min-height:100%;
  }
  body::before,body::after{
    content:''; position:fixed; border-radius:50%; background:#fff;
    filter:blur(1px); opacity:.9; pointer-events:none; z-index:0;
    width:210px; height:86px; left:-50px; top:46px;
    box-shadow:150px 34px 0 -12px #fff, 320px 6px 0 -22px #fff, 520px 40px 0 -26px #fff;
  }
  body::after{
    width:170px; height:70px; left:auto; right:-40px; top:210px;
    box-shadow:-190px 30px 0 -16px #fff, -380px -8px 0 -22px #fff;
  }
  h1{
    position:relative; z-index:1; font-family:'Jua',sans-serif; font-weight:400;
    font-size:clamp(24px,4vw,36px); letter-spacing:1px; text-align:center;
    margin:4px 0 12px; color:#fff;
    text-shadow:0 2px 0 #f3a8bc, 0 4px 0 #e79db4, 0 9px 16px rgba(120,86,66,.28);
  }
  .panel{
    position:relative; z-index:1; width:min(1240px,100%);
    background:linear-gradient(180deg,var(--wood1),var(--wood2) 55%,var(--wood3));
    border-radius:30px; padding:12px;
    box-shadow:0 20px 44px rgba(92,62,40,.28), inset 0 2px 0 rgba(255,255,255,.4);
  }
  .panel::before{
    content:''; position:absolute; inset:5px; border-radius:26px;
    border:2px dashed rgba(255,255,255,.32); pointer-events:none;
  }
  .inner{
    position:relative; background:var(--cream); border-radius:22px; padding:18px;
    box-shadow:inset 0 2px 12px rgba(150,120,85,.16), inset 0 0 0 3px #fffdf7;
    overflow:hidden;
  }
  .screen{display:none;}
  .screen.on{display:block;}

  /* ---------- create / join ---------- */
  .hero{
    position:relative; border-radius:18px; overflow:hidden;
    background:linear-gradient(180deg,#eaf7fb,#fdf8ec);
  }
  .hero img.art{
    display:block; width:100%; height:330px; object-fit:cover; object-position:50% 42%;
    opacity:.95; mix-blend-mode:multiply;
  }
  #scr-join .hero img.art{height:400px;}
  .hero .overlay{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:flex-end; padding:22px 22px 26px;
    background:linear-gradient(180deg, rgba(253,248,236,0) 0%, rgba(253,248,236,.55) 42%, rgba(253,248,236,.94) 72%, rgba(253,248,236,.99) 100%);
    text-align:center;
  }
  .hero .big{font-size:clamp(20px,3.2vw,30px); color:#4a382a; line-height:1.35; text-shadow:0 2px 0 #fff;}
  .hero .sub{color:#8b7761; font-size:14px; margin-top:8px;}
  .joinbox{
    display:flex; gap:8px; margin-top:16px; width:min(420px,100%);
  }
  .joinbox input{flex:1;}
  .field{display:flex; flex-direction:column; gap:7px; margin-bottom:12px;}
  .field label{font-size:14px; color:var(--ink2);}
  input[type=text],select{
    font-family:inherit; font-size:17px; color:var(--ink);
    background:#fffdf6; border:2px solid var(--line); border-radius:14px;
    padding:12px 14px; outline:none; width:100%; transition:.15s;
  }
  input[type=text]:focus,select:focus{border-color:#e7b96a; box-shadow:0 0 0 4px rgba(239,184,74,.18);}
  .row2{display:grid; grid-template-columns:1fr 150px; gap:14px;}
  @media(max-width:560px){ .row2{grid-template-columns:1fr;} }

  .btn{
    font-family:inherit; font-size:17px; cursor:pointer; border:none;
    border-radius:16px; padding:13px 22px; color:#5a4028;
    background:linear-gradient(180deg,#fff8e6,#f2e3c4);
    box-shadow:0 3px 0 #d9c3a0, 0 6px 14px rgba(140,105,70,.18);
    transition:.12s; white-space:nowrap;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn:active{transform:translateY(2px); box-shadow:0 1px 0 #d9c3a0;}
  .btn.primary{color:#6b3a24; background:linear-gradient(180deg,#ffd9a0,#f6b96a); box-shadow:0 3px 0 #d99a4c, 0 8px 18px rgba(210,150,80,.28);}
  .btn.pink{color:#7d2f45; background:linear-gradient(180deg,#ffd3de,#f5a8bd); box-shadow:0 3px 0 #d988a0, 0 8px 18px rgba(220,140,165,.26);}
  .btn.ghost{background:#fffdf6; color:var(--ink2); box-shadow:0 2px 0 #e3d7c2;}
  .btn[disabled]{opacity:.5; cursor:not-allowed; transform:none;}
  .btn-block{width:100%;}
  .btn-sm{font-size:14px; padding:9px 14px; border-radius:12px;}

  /* ---------- board ---------- */
  .bar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:2px 4px 10px;
  }
  .bar .info{font-size:14px; color:var(--ink2);}
  .bar .right{display:flex; gap:8px; align-items:center;}

  .scoreboard{
    display:flex; justify-content:center; gap:7px; width:fit-content; margin-left:auto; margin-right:auto; padding:9px; border-radius:14px;
    background:linear-gradient(180deg,#3b3229,#241d17);
    box-shadow:inset 0 2px 6px rgba(0,0,0,.5), 0 2px 0 rgba(255,255,255,.4);
    margin-bottom:8px;
  }
  .lamp{
    flex:1 1 0; min-width:124px; max-width:170px; height:40px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    font-size:12px; color:#7a6a58; background:#1b1611;
    box-shadow:inset 0 2px 5px rgba(0,0,0,.7);
    transition:.25s; overflow:hidden; white-space:nowrap;
  }
  .lamp.on{
    color:#5a3b00; background:linear-gradient(180deg,#ffe680,#f7bd2e);
    box-shadow:0 0 16px rgba(255,205,70,.85), inset 0 0 8px rgba(255,255,255,.6);
    animation:lampPulse 1.1s ease-in-out infinite;
  }
  @keyframes lampPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18)}}

  .stage{position:relative; border-radius:16px; overflow:hidden; background:#fdfaf0;
    box-shadow:inset 0 0 0 2px #f0e6d0;}
  .stage canvas{display:block; width:100%;}

  .actors{position:absolute; inset:0; pointer-events:none;}
  .actor{
    position:absolute; width:104px; height:118px; margin-left:-52px; text-align:center;
    pointer-events:none; will-change:left,top,transform;
  }
  .actor .nm{
    position:absolute; z-index:3; left:50%; top:-24px; transform:translateX(-50%);
    display:inline-block; font-size:15px; color:#4a382a;
    padding:1px 9px; border-radius:10px; background:rgba(255,255,255,.95);
    box-shadow:0 1px 3px rgba(120,90,60,.18);
    max-width:104px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .actor.win .nm{color:#c9821c;}
  .actor img{
    display:block; height:118px; width:auto; margin:0 auto; position:absolute; bottom:0; left:0; right:0;
    filter:drop-shadow(0 3px 3px rgba(120,90,60,.18));
  }
  .actor .readybtn{
    position:absolute; top:52px; right:-16px; width:38px; height:24px; border-radius:12px; z-index:6;
    border:2px solid #d9c9a8; background:#fffdf6; color:#b8a482;
    font-family:inherit; font-size:11px; line-height:1; cursor:pointer; pointer-events:auto;
    box-shadow:0 2px 0 #d9c9a8; transition:.15s; display:flex; align-items:center; justify-content:center;
  }
  .actor .readybtn:hover{transform:translateY(-1px);}
  .actor .readybtn[disabled]{opacity:.5; cursor:default; box-shadow:none; transform:none;}
  .actor .readybtn.on{
    background:linear-gradient(180deg,#ffe680,#f7bd2e); color:#7a5200;
    border-color:#e0a92a; box-shadow:0 0 12px rgba(247,189,46,.8);
  }
  .actor.ready img{filter:drop-shadow(0 0 6px rgba(247,189,46,.75));}
  .actor.idle img{animation:idleBob 2.4s ease-in-out infinite; transform-origin:50% 100%;}
  @keyframes idleBob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.02)}}
  .actor .emote{
    position:absolute; top:-10px; left:66px; width:54px; height:54px; border-radius:50%;
    background:#fff; border:3px solid #fff; box-shadow:0 4px 10px rgba(120,90,60,.28);
    overflow:hidden; display:none; animation:popIn .35s ease-out;
  }
  .actor .emote img{width:100%; height:100%; object-fit:cover; background:#fff;}
  .actor.win .emote,.actor.lose .emote{display:block;}
  .actor.win .emote{width:66px; height:66px; top:-16px; left:60px; border-color:#ffd979; box-shadow:0 0 16px rgba(247,189,46,.9), 0 4px 10px rgba(120,90,60,.28);}
  @keyframes popIn{from{transform:scale(.3); opacity:0}to{transform:scale(1); opacity:1}}
  .actor.win img.body{animation:winShake .45s ease-in-out infinite;}
  @keyframes winShake{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(6deg) translateY(-4px)}}
  .actor.lose img.body{animation:clapBob .5s ease-in-out infinite;}
  @keyframes clapBob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-5px) scale(1.03)}}

  .empty{
    position:absolute; width:96px; margin-left:-48px; text-align:center; color:#bcae97;
    font-size:12px;
  }
  .empty .ghost{
    width:56px; height:70px; margin:0 auto 4px; border:2px dashed #dfd2b8; border-radius:14px;
    background:rgba(255,255,255,.35);
  }

  .countdown{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(253,248,236,.38); backdrop-filter:blur(1px); z-index:5;
  }
  .countdown.on{display:flex;}
  .countdown span{
    font-size:clamp(70px,14vw,150px); color:#fff; line-height:1;
    text-shadow:0 4px 0 #f0a44a, 0 8px 0 #d98a2e, 0 16px 30px rgba(150,90,30,.4);
    animation:cdPop .9s ease-out;
  }
  @keyframes cdPop{0%{transform:scale(2.2); opacity:0}45%{transform:scale(1); opacity:1}100%{transform:scale(.94)}}

  .banner{
    margin-top:10px; text-align:center; font-size:19px; color:#7a5a2e; min-height:26px;
  }
  .banner b{color:#d2691e;}
  .board-actions{display:flex; gap:10px; justify-content:center; align-items:center; margin-top:12px; flex-wrap:wrap;}

  /* ---------- layout with chat ---------- */
  #scr-board .layout{ display:grid; grid-template-columns:minmax(0,1fr) 318px; gap:14px; align-items:stretch; }
  .board-col{ min-width:0; }
  .chat-col{
    display:flex; flex-direction:column; min-height:520px; overflow:hidden;
    background:#fffdf6; border-radius:18px;
    box-shadow:inset 0 0 0 2px #efe4cd, 0 3px 10px rgba(150,120,85,.10);
  }
  .chat-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; font-size:15px; color:#7a6653; border-bottom:2px dashed #eee2c9;
  }
  .chat-head .cnt{ font-size:12px; color:#b3a48f; }
  .chat-list{ flex:1; overflow-y:auto; padding:10px 12px; display:flex; flex-direction:column; gap:8px; }
  .chat-list:empty::after{ content:'아직 대화가 없어요. 먼저 인사해 보세요!'; color:#bcae97; font-size:13px; text-align:center; margin-top:20px; }
  .msg{ max-width:88%; font-size:13px; line-height:1.35; }
  .msg .who{ font-size:11px; color:#a08f7a; margin-bottom:2px; }
  .msg .bubble{ background:#f3ecdc; color:#4a382a; padding:7px 10px; border-radius:12px; word-break:break-word; white-space:pre-wrap; }
  .msg.me{ align-self:flex-end; text-align:right; }
  .msg.me .bubble{ background:linear-gradient(180deg,#ffe9b8,#f9d08a); }
  .chat-form{ display:flex; gap:6px; padding:9px; border-top:2px dashed #eee2c9; }
  .chat-form input{ flex:1; font-size:14px; padding:9px 11px; border-radius:11px; border:2px solid #e7dcc6; font-family:inherit; }
  .chat-form button{
    font-family:inherit; font-size:14px; padding:0 14px; border-radius:11px; border:none; cursor:pointer;
    color:#6b3a24; background:linear-gradient(180deg,#ffd9a0,#f6b96a); box-shadow:0 2px 0 #d99a4c;
  }
  #scr-create .hero, #scr-join .hero{ max-width:780px; margin:0 auto; }
  @media(max-width:980px){
    #scr-board .layout{ grid-template-columns:1fr; }
    .chat-col{ height:230px; }
    .chat-list{ padding:8px 10px; }
  }

  .mutebtn{
    position:fixed; top:16px; right:18px; z-index:30; width:46px; height:46px; border-radius:50%;
    border:2px solid #e6d7b8; background:linear-gradient(180deg,#fffdf4,#f3e8cd); color:#8a6a3a;
    font-size:20px; font-family:'Jua',sans-serif; cursor:pointer;
    box-shadow:0 3px 10px rgba(120,90,60,.22); line-height:1;
  }
  .mutebtn.off{color:#c0a98c; background:#f7f0e0;}
  .mutebtn:hover{transform:translateY(-1px);}
  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    background:#5c4632ee; color:#fff; font-size:14px; padding:10px 18px; border-radius:14px;
    opacity:0; pointer-events:none; transition:.25s; z-index:9;
  }
  .toast.on{opacity:1;}
  .conn{font-size:12px; color:#9aab8f; text-align:center; margin-top:10px;}
  .conn.off{color:#c08080;}
</style>
</head>
<body>
  <h1>오늘은 당신! 윳놀이</h1>

  <div class="panel">
    <div class="inner">

      <!-- 방 만들기 -->
      <section id="scr-create" class="screen">
        <div class="hero">
          <img class="art" src="yut-hero.jpg" alt="">
          <div class="overlay">
            <div class="big">방을 만들고<br>친구들을 불러 보세요</div>
            <div class="sub">링크를 보내면 친구들이 들어와요</div>
          </div>
        </div>
        <div class="field" style="margin-top:14px">
          <label for="createName">내 이름</label>
          <input type="text" id="createName" maxlength="10" placeholder="예: 두희">
        </div>
        <button class="btn primary btn-block" id="btnCreate">방 만들기</button>
        <p class="hint">링크를 연 사람이 입장할 때마다 함께 윷을 던져요 (최대 8명)</p>
      </section>

      <!-- 입장 -->
      <section id="scr-join" class="screen">
        <div class="hero">
          <img class="art" src="yut-hero.jpg" alt="">
          <div class="overlay">
            <div class="big">윳놀이에 들어갑니다<br>이름을 정하세요</div>
            <div class="sub" id="joinSub">이름을 정하면 친구들과 함께 시작할 수 있어요</div>
            <div class="joinbox">
              <input type="text" id="joinName" maxlength="10" placeholder="이름 입력">
              <button class="btn primary" id="btnJoin">입장</button>
            </div>
          </div>
        </div>
      </section>

      <!-- 보드 -->
      <section id="scr-board" class="screen">
       <div class="layout">
        <div class="board-col">
        <div class="bar">
          <div class="info" id="boardInfo">레디 0 / 0</div>
          <div class="right">
            <button class="btn ghost btn-sm" id="btnCopy">링크 복사</button>
          </div>
        </div>

        <div class="scoreboard" id="scoreboard"></div>

        <div class="stage" id="stage">
          <canvas id="cv"></canvas>
          <div class="actors" id="actors"></div>
          <div class="countdown" id="countdown"><span id="cdNum">5</span></div>
        </div>

        <div class="banner" id="banner"></div>
        <div class="board-actions">
          <button class="btn pink" id="btnLeave">나가기</button>
        </div>
        </div>
        <aside class="chat-col">
          <div class="chat-head"><span>채팅</span><span class="cnt" id="chatCount">0개</span></div>
          <div class="chat-list" id="chatList"></div>
          <div class="chat-form">
            <input type="text" id="chatInput" maxlength="200" placeholder="메시지 입력…">
            <button id="chatSend">전송</button>
          </div>
        </aside>
       </div>
      </section>

      <div class="conn" id="conn"></div>
    </div>
  </div>

  <button class="mutebtn" id="btnMute" title="배경음 켜기/끄기">♪</button>
  <div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';
  var API = '/api/room';
  var MAX = 8;
  var ROWS = 11;
  var IMG = { c:[ 'k1.png','k2.png','k3.png','k4.png','k5.png','k6.png','k7.png','k8.png' ], laugh:'k-laugh.png', clap:'k-clap.png' };

  function $(s){ return document.querySelector(s); }
  function show(el, on){ el.classList.toggle('on', !!on); }
  function toast(msg){
    var t = $('#toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('on'); }, 2200);
  }

  var myId = sessionStorage.getItem('sadari.id');
  if(!myId){ myId = 'u' + Math.random().toString(36).slice(2,9); sessionStorage.setItem('sadari.id', myId); }
  var params = new URLSearchParams(location.search);
  var topic = params.get('r') || sessionStorage.getItem('sadari.topic') || '';

  var state = { v:0, host:'', players:[], ready:{}, phase:'lobby', ladder:null, winCol:0, round:0, chat:[] };
  var vphase = 'lobby';
  var pollTimer = 0, polling = false, playedRound = 0, startGuard = false, busy = false;

  function count(){ return state.players.length; }

  function setConn(ok){
    var c = $('#conn');
    c.textContent = ok ? '● 연결됨' : '● 연결 중…';
    c.classList.toggle('off', !ok);
  }

  /* ---------------- sync ---------------- */
  function readState(){
    return fetch(API + '?id=' + encodeURIComponent(topic) + '&t=' + Date.now(), { cache:'no-store' })
      .then(function(r){
        if(r.status === 404) return null;
        if(!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      });
  }

  function payload(){
    return {
      v: (state.v || 0) + 1,
      ts: Date.now(),
      host: state.host,
      players: state.players.map(function(p){ return { id:p.id, name:p.name }; }),
      ready: state.ready,
      phase: state.phase,
      ladder: state.ladder,
      winCol: state.winCol,
      round: state.round,
      chat: state.chat || []
    };
  }

  function writeState(){
    var data = payload();
    return fetch(API + '?id=' + encodeURIComponent(topic), {
      method: 'POST',
      headers: { 'Content-Type':'application/json' },
      body: JSON.stringify(data)
    }).then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      state.v = data.v;
      setConn(true);
    });
  }

  function adopt(remote){
    if(!remote) return;
    state.v = remote.v || 0;
    state.host = remote.host || '';
    state.players = (remote.players || []).slice();
    state.ready = remote.ready || {};
    state.phase = remote.phase || 'lobby';
    state.ladder = remote.ladder || null;
    state.winCol = (typeof remote.winCol === 'number') ? remote.winCol : 0;
    state.round = remote.round || 0;
    state.chat = (remote.chat || []).slice();
    if(state.phase === 'lobby'){ vphase = 'lobby'; startGuard = false; }
  }

  function mutate(fn){
    if(busy){ return Promise.resolve(); }
    busy = true;
    return readState()
      .then(function(remote){
        if(remote && (remote.v || 0) > state.v) adopt(remote);
        fn(state);
        return writeState();
      })
      .then(function(){ busy = false; render(); })
      .catch(function(){ busy = false; setConn(false); toast('동기화가 잠깐 끊겼어요'); });
  }

  function pollOnce(){
    readState()
      .then(function(remote){
        setConn(true);
        if(remote && (remote.v || 0) > state.v && !busy){
          adopt(remote);
          render();
        }
      })
      .catch(function(){ setConn(false); })
      .then(function(){
        var wait = 2200;
        if(document.hidden) wait = 8000;
        if(vphase === 'result') wait = 8000;
        pollTimer = setTimeout(pollOnce, wait);
      });
  }

  function startPolling(){ if(polling) return; polling = true; pollOnce(); }
  function stopPolling(){ polling = false; if(pollTimer) clearTimeout(pollTimer); pollTimer = 0; }

  /* ---------------- yut game ---------------- */
  var cv = $('#cv'), ctx = cv.getContext('2d');
  var GEO = { w:0, h:520, top:142, bottom:104 };
  var YUT_VAL = { '도':1, '개':2, '걸':3, '윷':4, '모':5 };

  function layout(){
    var stage = $('#stage');
    var w = Math.max(320, Math.floor(stage.clientWidth));
    var h = 520;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.style.width = w + 'px';
    cv.style.height = h + 'px';
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);

    var start = (GEO.w - span) / 2;

  function roundRect(x, y, w, h, r){
    ctx.beginPath();

    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();

  function hash32(x){
    x = (x ^ 61) ^ (x >>> 16);
    x = (x + (x << 3)) >>> 0;
    x = x ^ (x >>> 4);
    x = Math.imul(x, 0x27d4eb2d) >>> 0;
    x = x ^ (x >>> 15);
    return x >>> 0;

    var h = hash32(((seed >>> 0) ^ Math.imul(round + 1, 0x9e3779b1) ^ Math.imul(idx + 1, 0x85ebca6b)) >>> 0);
    var sticks = [], up = 0, k, bit;
    for(k = 0; k < 4; k++){
      bit = (h >>> (k * 7)) & 1;
      sticks.push(!!bit);
      if(bit) up++;

    var name = up === 0 ? '모' : (up === 1 ? '도' : (up === 2 ? '개' : (up === 3 ? '걸' : '윷')));
    return { sticks: sticks, up: up, name: name, value: YUT_VAL[name] };
  }

    var participants = [], seq = [], rounds = 0, winner = -1, i, j, round;
    for(i = 0; i < n; i++) participants.push(i);
    for(round = 0; round < 8; round++){
      rounds = round + 1;
      var maxV = -1, tied = [], r;
      for(j = 0; j < participants.length; j++){

        seq.push({ i: participants[j], round: round, res: r });
        if(r.value > maxV){ maxV = r.value; tied = [participants[j]]; }
        else if(r.value === maxV){ tied.push(participants[j]); }
      }
      if(tied.length === 1){ winner = tied[0]; break; }
      participants = tied;
    }
    return { seq: seq, winner: winner, rounds: rounds };
  }

      roundRect(cx - w / 2, cy - h / 2, w, h, 11);
      ctx.fillStyle = '#e9f4df'; ctx.fill();
      ctx.strokeStyle = '#c3e0a9'; ctx.lineWidth = 2.5; ctx.stroke();

  function drawPan(cx, cy, r){
    ctx.save();

    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();

      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(196,164,112,.5)';
    for(k = 0; k < 4; k++){

    else{ g.addColorStop(0, '#dcc097'); g.addColorStop(1, '#c19a63'); }
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = '#a97f4d'; ctx.lineWidth = 2; ctx.stroke();

  /* ---------------- start / countdown / race ---------------- */

    else{

        if(vphase !== 'lobby' || startGuard || busy) return;
        var firstId = state.players[0] && state.players[0].id;
        var hostHere = state.players.some(function(p){ return p.id === state.host; });

    return { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f };
  }

  function runThrows(){
    var n = count();
    if(!n) return;
    var built = buildSequence(state.seed || 1, n);
    yutSeq = built.seq;
    yutWinner = -1;
    yutResults = {};
    var per = 1500, gap = 260, t0 = 0;

    function frame(ts){
      if(!t0) t0 = ts;
      var elapsed = ts - t0;
      var cur = Math.floor(elapsed / (per + gap));
      if(cur >= yutSeq.length){
        yutWinner = built.winner;
        var winThrow = null, wi;
        for(wi = 0; wi < yutSeq.length; wi++){ if(yutSeq[wi].i === yutWinner){ winThrow = yutSeq[wi].res; } }
        stickState.res = winThrow;
        stickState.t = 1;
        stickState.fromX = colX(yutWinner, n);
        vphase = 'result';
        render();
        fanfare();
        return;
      }
      var shown = Math.min(yutSeq.length, Math.floor(elapsed / (per + gap)));
      for(var kk = 0; kk < shown; kk++){ yutResults[yutSeq[kk].i] = yutSeq[kk].res.name; }
      var step = yutSeq[cur];
      var local = (elapsed - cur * (per + gap)) / per;
      if(local <= 1){
        stickState.res = step.res;
        stickState.t = local;
        stickState.fromX = colX(step.i, n);
      }
      if(local > 0.8) yutResults[step.i] = step.res.name;
      drawBoard();
      rafId = requestAnimationFrame(frame);
    }
    rafId = requestAnimationFrame(frame);
  }

  /* ---------------- background music (grand) ---------------- */
  var AC = null, master = null, reverb = null, musicTimer = 0, nextStepTime = 0, stepIdx = 0, noiseBuf = null;
  var musicOn = true;
  try { musicOn = localStorage.getItem('sadari.mute') !== '1'; } catch(e){}

  var BPM = 126, STEP_DUR = 60 / BPM / 4;
  var BARS = [
    { chord: [57, 60, 64], root: 45 },
    { chord: [53, 57, 60], root: 41 },
    { chord: [55, 60, 64], root: 48 },
    { chord: [55, 59, 62], root: 43 }
  ];
  var MELODY = [
    [[0, 76, 6], [8, 74, 3], [12, 72, 3]],
    [[0, 72, 6], [8, 69, 3], [12, 72, 3]],
    [[0, 76, 6], [8, 79, 3], [12, 76, 3]],
    [[0, 74, 6], [8, 71, 3], [12, 67, 4]]
  ];

  function midiFreq(m){ return 440 * Math.pow(2, (m - 69) / 12); }

  function makeImpulse(seconds, decay){
    var rate = AC.sampleRate, len = Math.floor(rate * seconds);
    var buf = AC.createBuffer(2, len, rate);
    for(var ch = 0; ch < 2; ch++){
      var d = buf.getChannelData(ch);
      for(var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }

  function initAudio(){
    if(AC) return;
    var Ctx = window.AudioContext || window.webkitAudioContext;

    AC = new Ctx();
    master = AC.createGain();
    master.gain.value = musicOn ? 0.3 : 0;
    var comp = AC.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 4;
    master.connect(comp);
    comp.connect(AC.destination);
    reverb = AC.createConvolver();
    reverb.buffer = makeImpulse(2.8, 2.2);
    var revGain = AC.createGain();
    revGain.gain.value = 0.55;
    reverb.connect(revGain);
    revGain.connect(master);
  }

  function voice(type, freq, t, dur, vol, cutoff, detune, atk){
    if(!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if(detune) o.detune.setValueAtTime(detune, t);
    var a = atk || 0.02;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    if(cutoff){
      var f = AC.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = cutoff;
      o.connect(f); f.connect(g);
    }else{
      o.connect(g);
    }
    g.connect(master);
    if(reverb) g.connect(reverb);
    o.start(t); o.stop(t + dur + 0.06);
  }

  function noiseHit(t, dur, vol, hp){
    if(!AC) return;
    if(!noiseBuf){
      noiseBuf = AC.createBuffer(1, Math.floor(AC.sampleRate * 1), AC.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for(var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    var s = AC.createBufferSource(); s.buffer = noiseBuf;
    var f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 3000;
    var g = AC.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master);
    if(reverb) g.connect(reverb);
    s.start(t); s.stop(t + dur + 0.05);
  }

  function timpani(t, vol){
    if(!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(145, t);
    o.frequency.exponentialRampToValueAtTime(52, t + 0.34);
    g.gain.setValueAtTime(vol || 0.55, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.75);
    o.connect(g); g.connect(master);
    if(reverb) g.connect(reverb);
    o.start(t); o.stop(t + 0.8);
    noiseHit(t, 0.12, 0.08, 900);
  }

  function scheduleStep(s, t){
    var bar = Math.floor(s / 16) % 4;
    var st = s % 16;
    var B = BARS[bar];
    var i, k;

    if(st === 0){
      for(i = 0; i < B.chord.length; i++){
        voice('sawtooth', midiFreq(B.chord[i]), t, 15 * STEP_DUR, 0.055, 2000, -7, 0.45);
        voice('sawtooth', midiFreq(B.chord[i]), t, 15 * STEP_DUR, 0.045, 2000, 7, 0.5);
        voice('triangle', midiFreq(B.chord[i] + 12), t, 12 * STEP_DUR, 0.02, 3200, 0, 0.6);
      }
      noiseHit(t, 1.2, 0.05, 5200);
    }
    if(st === 0 || st === 8){
      voice('triangle', midiFreq(B.root), t, 6 * STEP_DUR, 0.34, 750, 0, 0.01);
      voice('sine', midiFreq(B.root - 12), t, 6 * STEP_DUR, 0.2, 320, 0, 0.01);
    }
    var m = MELODY[bar];
    for(k = 0; k < m.length; k++){
      if(m[k][0] === st) voice('square', midiFreq(m[k][1]), t, m[k][2] * STEP_DUR, 0.15, 4400, 0, 0.015);
    }
    if(st === 0) timpani(t, 0.55);
    if(st === 10) timpani(t, 0.3);
    if(st === 4 || st === 12) noiseHit(t, 0.1, 0.09, 2400);
    if(bar === 3 && st >= 12) noiseHit(t, 0.07, 0.07, 3200);
  }

  function musicTick(){
    if(!AC || !musicOn) return;
    while(nextStepTime < AC.currentTime + 0.2){
      scheduleStep(stepIdx, nextStepTime);
      nextStepTime += STEP_DUR;
      stepIdx = (stepIdx + 1) % 64;
    }
  }

  function startMusic(){
    if(!AC) return;
    if(AC.state === 'suspended') AC.resume();
    if(musicTimer) return;
    nextStepTime = AC.currentTime + 0.1;
    musicTimer = setInterval(musicTick, 25);
  }

  function stopMusic(){
    if(musicTimer){ clearInterval(musicTimer); musicTimer = 0; }
  }

  function applyMute(){
    if(master) master.gain.value = musicOn ? 0.3 : 0;
    var b = $('#btnMute');
    if(b){ b.textContent = musicOn ? '♪' : '✕'; b.classList.toggle('off', !musicOn); }
  }

  function toggleMute(){
    musicOn = !musicOn;
    try { localStorage.setItem('sadari.mute', musicOn ? '0' : '1'); } catch(e){}
    initAudio(); applyMute();
    if(musicOn) startMusic(); else stopMusic();
  }

  function blip(freq, dur, vol){
    if(!AC || !musicOn) return;
    voice('square', freq, AC.currentTime + 0.01, dur || 0.09, vol || 0.2, 4000);
  }

  function fanfare(){
    if(!AC || !musicOn) return;
    var t0 = AC.currentTime + 0.05;
    timpani(t0, 0.6);
    [72, 76, 79, 84].forEach(function(m, i){
      voice('sawtooth', midiFreq(m), t0 + i * 0.13, 0.7, 0.13, 5000, 0, 0.02);
      voice('square', midiFreq(m + 12), t0 + i * 0.13, 0.5, 0.06, 6000, 0, 0.02);
    });
    timpani(t0 + 0.52, 0.5);
  }

  function armAudio(){
    initAudio();
    applyMute();
    if(musicOn) startMusic();
  }

  /* ---------------- actions ---------------- */
  $('#btnCreate').addEventListener('click', function(){
    var name = $('#createName').value.trim();
    if(!name){ toast('이름을 입력해 주세요'); return; }
    var init = {
      v: 1, ts: Date.now(), host: myId,
      players: [{ id: myId, name: name }],
      ready: {}, phase: 'lobby', ladder: null, winCol: 0, round: 0
    };
    fetch(API, {
      method:'POST',
      headers: { 'Content-Type':'application/json' },
      body: JSON.stringify(init)
    }).then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function(j){
      topic = j.id;
      sessionStorage.setItem('sadari.topic', topic);
      sessionStorage.setItem('sadari.name', name);
      history.replaceState(null, '', location.pathname + '?r=' + topic);
      state.v = 1; state.host = myId;
      state.players = [{ id:myId, name:name }];
      state.ladder = init.ladder; state.phase = 'lobby'; state.ready = {};
      vphase = 'lobby';
      setConn(true);
      startPolling();
      render();
    }).catch(function(e){
      toast('방을 만들지 못했어요. 잠시 후 다시 시도해 주세요');
    });
  });

  $('#btnJoin').addEventListener('click', function(){
    var name = $('#joinName').value.trim();
    if(!name){ toast('이름을 입력해 주세요'); return; }
    if(count() >= MAX && !state.players.some(function(p){ return p.id === myId; })){
      toast('정원이 가득 찼어요 (최대 ' + MAX + '명)');
      return;
    }
    sessionStorage.setItem('sadari.name', name);
    vphase = 'lobby';
    mutate(function(s){
      if(s.players.some(function(p){ return p.id === myId; })){
        s.players.forEach(function(p){ if(p.id === myId) p.name = name; });
      }else{
        s.players.push({ id:myId, name:name });
      }
      if(s.phase !== 'lobby'){
        s.phase = 'lobby'; s.ready = {}; s.winCol = 0; s.round = 0;
      }
    });
  });

  $('#btnCopy').addEventListener('click', function(){
    var link = location.origin + location.pathname + '?r=' + topic;
    navigator.clipboard.writeText(link).then(function(){ toast('링크를 복사했어요'); },
      function(){ toast(link); });
  });

  function leave(){
    stopPolling();
    stopRace();
    mutate(function(s){
      s.players = s.players.filter(function(p){ return p.id !== myId; });
      delete s.ready[myId];
      if(!s.players.length){ s.phase = 'lobby'; s.ready = {}; s.winCol = 0; s.round = 0; }
    }).then(function(){ setTimeout(function(){ location.reload(); }, 200); });
  }
  $('#btnLeave').addEventListener('click', leave);

  document.addEventListener('click', function(e){
    var btn = e.target.closest && e.target.closest('.readybtn');
    if(!btn || btn.disabled) return;
    if(vphase !== 'lobby' || busy) return;
    var me = state.players.filter(function(p){ return p.id === myId; })[0];
    if(!me) return;
    var on = !state.ready[myId];
    state.ready[myId] = on;
    render();
    mutate(function(s){ s.ready[myId] = on; });
  });

  document.addEventListener('pointerdown', function(){
    if(armAudio.done) return;
    armAudio.done = true;
    armAudio();
  });
  document.addEventListener('keydown', function(){
    if(armAudio.done) return;
    armAudio.done = true;
    armAudio();
  });
  $('#btnMute').addEventListener('click', function(e){ e.stopPropagation(); toggleMute(); });

  if($('#chatSend')) $('#chatSend').addEventListener('click', function(e){ e.stopPropagation(); sendChat(); });
  if($('#chatInput')){
    $('#chatInput').addEventListener('keydown', function(e){
      e.stopPropagation();
      if(e.key === 'Enter'){ e.preventDefault(); sendChat(); }
    });
  }

  window.addEventListener('resize', function(){
    if($('#scr-board').classList.contains('on')){ drawBoard(); renderActors(); }
  });

  /* ---------------- boot ---------------- */
  (function boot(){
    if(topic){
      var saved = sessionStorage.getItem('sadari.name');
      if(saved) $('#joinName').value = saved;
      startPolling();
    }
    setConn(false);
    render();
  })();
})();
</script>
</body>
</html>
